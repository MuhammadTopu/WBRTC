<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Wallpaper</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
    }
    img{
      margin-top: 10%;
      margin-left: 30%;
    }

    
  </style>
</head>
<body>

  <h1 id="copy-text" >Copy me </h1>

    <img src="/git.png" alt="">
  <script>
    document.body.addEventListener('mousemove', function (e) {
      let x = e.clientX;
      let y = e.clientY;

      let r = Math.floor((x / window.innerWidth) * 255);
      let g = Math.floor((y / window.innerHeight) * 210);
      let p = Math.floor(Math.random() * 0);  
      document.body.style.backgroundColor = `rgb(${r}, ${g}, ${p})`;
    });

    const copyText = document.getElementById('copy-text');

    const textToCopy = "I love you";


    copyText.addEventListener('click', function() {
       
        const tempInput = document.createElement('input');
        document.body.appendChild(tempInput);
        tempInput.value = textToCopy; 
        tempInput.select();
        document.execCommand('copy'); 

       
        document.body.removeChild(tempInput);

  
    });
  </script>
</body>
</html>
